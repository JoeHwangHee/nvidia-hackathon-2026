# TradeSentry OpenShell 샌드박스 정책 — 채점 대상 실행용(단위 F4, 소유 M, 보안 검토)
#
# OpenShell(에이전트를 격리해 돌리는 NVIDIA 샌드박스 런타임) 정책이다. 이 한 파일을 두 채점 대상 실행 샌드박스에 쓴다.
#   - 개발 평가용 채점 대상 실행 샌드박스(dev20·real_dev)
#   - RB-1 동결 뒤 새로 만드는 공식 채점 대상 실행 전용 샌드박스(holdout40·real_sealed). 차이는 정책이 아니라 이미지
#     내용(봉인 입력 사본)이다. 정적 계층은 샌드박스를 만들 때 고정되므로 전용 샌드박스는 새로 만든다.
# NemoClaw 시연 샌드박스는 이 파일을 쓰지 않는다. 정적 계층은 NemoClaw가 정하고, 네트워크 부분만
# configs/openshell/policy_demo_network.yaml로 바꾼다(결정 기록 model-decision-mt5-sandbox ①).
#
# 출발점: X1 시험 샌드박스 2판(spikes/x1/policy/x1-os-test.nim.policy.yaml, OpenShell 0.0.116에서 적용·위반 시험을 마친
# 구조). 경로만 이 이미지(configs/openshell/image/Dockerfile)의 배치로 바꿨다. 빼는 방향으로만 고친다.
#
# 요건(docs/plan/DEV_PLAN.md §4.1·§4.4)
#   (a) 정답표·봉인 폴더를 들이지 않는다. 앱 코드·설정·스냅샷은 /opt/tradesentry에 읽기 전용으로 두고, 작업 폴더
#       /sandbox와 쓰기 경로 밖에 둔다. 저장소 정답 경로·outputs/·artifacts/eval/·eval/scorer/·.env는 이미지에 없다
#       (포함 목록 configs/openshell/image/include.txt). 미끼 파일 /srv/tradesentry_decoy는 허용 목록 밖이다.
#   (b) 외부 전송은 NVIDIA 추론 엔드포인트 하나, POST /v1/chat/completions 한 경로, 실행 파일은 CLI의 파이썬 하나
#       (이미지의 uv 관리 Python 3.12.13 폴더)만 연다. rules를 생략하지 않고 /** 경로를 쓰지 않는다.
#   (c) 키는 샌드박스에 두지 않는다. provider(configs/openshell/provider_profile.yaml)를 붙이면 환경변수 NVIDIA_API_KEY에는
#       자리표시 값만 있고, 샌드박스 안 감독 프로세스의 정책 프록시가 요청 시점에 실제 키로 바꾼다(결정 기록 1556).
#   (d)·(e) 감사 로그와 위반 시험표는 scripts/openshell_violation_tests.py가 만든다.
#
# 파일시스템 항목
#   /opt/tradesentry          앱 코드(src)·설정(configs)·자료(data)·Python·가상환경. 읽기만 한다
#   /sandbox/read_only_probe  시험 전용 빈 폴더. 작업 폴더 아래 read_only 자식이 쓰기를 막는지 보는 위반 시험 행에만 쓴다
#                             (자료 계약 §10.3 "읽기 전용 입력"). 여기에는 입력을 두지 않는다
#   /tmp, /dev/null           쓰기. 실행 출력은 작업 폴더 /sandbox 아래에만 쓴다(앱의 약속, include_workdir)
# 키 값과 호스트의 로컬 절대경로를 이 파일에 적지 않는다.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /opt/tradesentry
  - /sandbox/read_only_probe
  read_write:
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  tradesentry_nim_chat:
    name: tradesentry-nim-chat
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
    binaries:
    - path: /opt/tradesentry/python/**
