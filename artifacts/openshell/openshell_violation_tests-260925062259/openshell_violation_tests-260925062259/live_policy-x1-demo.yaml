version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /run/nemoclaw/managed-startup-ca-bundle.pem
  - /run/nemoclaw/managed-startup-runtime.env
  - /etc
  - /var/log
  - /var/lib/dpkg
  read_write:
  - /tmp
  - /dev/null
  - /dev/pts
  - /sandbox/.openclaw
  - /sandbox/.nemoclaw
  - /home/linuxbrew
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nvidia:
    name: nvidia
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
    binaries:
    - path: /usr/local/bin/openclaw
    - path: /usr/local/bin/node
