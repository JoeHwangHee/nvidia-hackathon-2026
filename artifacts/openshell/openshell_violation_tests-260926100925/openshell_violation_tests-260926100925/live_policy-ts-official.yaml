version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /opt/tradesentry
  - /sandbox/read_only_probe
  - /var/log
  read_write:
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  tradesentry_nim_chat:
    name: tradesentry-nim-chat
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
    binaries:
    - path: /opt/tradesentry/python/**
