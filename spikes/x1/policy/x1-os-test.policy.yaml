# X1 임시 샌드박스 정책(초안). OpenShell만 쓰는 시험 샌드박스용이며 시연·채점 대상 실행 샌드박스가 아니다.
# 출발점: OpenShell 0.0.116 기본 샌드박스의 라이브 정책(artifacts/openshell/logs/x1-default-base-policy.txt).
# 빼는 방향으로만 고쳤다.
# - 파일시스템: /app·/var/log·/sandbox(쓰기) 제거, 앱 경로 /opt/x1 읽기 전용 추가. /srv는 넣지 않는다(미끼 파일 위치).
# - 네트워크: 기본 블록 전부 제거. NIM 목적지는 provider(x1-nvidia-chat 프로필)가 붙일 때만 합성된다.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /opt/x1
  read_write:
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
