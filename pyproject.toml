# TradeSentry 프로젝트 정의. 가상환경과 lock(패키지 버전 고정 파일 uv.lock)은 uv(파이썬 패키지·가상환경 관리 도구)로 관리한다.
# 시험: uv run --locked python -m unittest discover -s tests -v   (저장소 루트에서 실행한다)
[project]
name = "tradesentry"
version = "0.1.0"
description = "관세청 수입통계 경보를 반증 검수해 담당자의 다음 업무를 제안하는 에이전트 TradeSentry"
requires-python = "==3.12.*"
# S0(앱 뼈대)의 코드는 표준 라이브러리만 쓴다. 외부 패키지는 그 패키지를 쓰는 작업이 버전을 고정해 더한다.
# NAT(nvidia-nat)는 X1(세로형 최소 통합 시험) 판을 앱 lock에 섞지 않고, 통합 방식(자문 명세서 Q1)을 정하는 작업이 더한다.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
